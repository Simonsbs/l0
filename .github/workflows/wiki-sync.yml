name: Wiki Sync

on:
  push:
    branches: [ "main" ]
    paths:
      - "docs/**"
      - "wiki/**"
      - "scripts/sync_wiki.sh"
      - "scripts/publish_wiki_remote.sh"
      - "wiki/SOURCE_MAP.tsv"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-wiki:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync local wiki mirror
        run: bash scripts/sync_wiki.sh

      - name: Publish to GitHub wiki
        env:
          WIKI_PUSH_TOKEN: ${{ secrets.WIKI_PUSH_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TOKEN="${WIKI_PUSH_TOKEN:-$GITHUB_TOKEN}"
          if [ -z "${TOKEN:-}" ]; then
            echo "error: missing token for wiki publish"
            exit 1
          fi
          REMOTE="https://x-access-token:${TOKEN}@github.com/${REPO}.wiki.git"
          bash scripts/publish_wiki_remote.sh "$REMOTE"
