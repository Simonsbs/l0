name: LLM Benchmark

on:
  schedule:
    - cron: "45 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  llm-benchmark:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq ripgrep

      - name: Build
        run: make

      - name: Run reference LLM usability benchmark
        run: |
          bash tests/llm_usability_bench.sh ./bin/l0c . reference \
            docs/LLM_BENCHMARK_RESULTS.json \
            docs/LLM_BENCHMARK_RESULTS.md
          cat docs/LLM_BENCHMARK_RESULTS.md

      - name: Commit updated benchmark results
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/LLM_BENCHMARK_RESULTS.json docs/LLM_BENCHMARK_RESULTS.md; then
            echo "No benchmark report change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/LLM_BENCHMARK_RESULTS.json docs/LLM_BENCHMARK_RESULTS.md
          git commit -m "LLM benchmark: refresh usability/token-efficiency results"
          git push

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: llm-benchmark-reports
          path: |
            docs/LLM_BENCHMARK_RESULTS.json
            docs/LLM_BENCHMARK_RESULTS.md
