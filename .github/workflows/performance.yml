name: Performance

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  perf-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: make

      - name: CI smoke performance gate
        run: bash tests/ci_smoke_bench.sh ./bin/l0c .

      - name: Comparison report
        run: |
          bash tests/benchmark_compare.sh ./bin/l0c . docs/PERFORMANCE_COMPARISON.md
          L0_A2A_PIN_CPU=0 bash tests/benchmark_apples_to_apples.sh ./bin/l0c . docs/PERFORMANCE_COMPARISON_APPLES_TO_APPLES.md docs/PERFORMANCE_COMPARISON_APPLES_TO_APPLES.json
          cat docs/PERFORMANCE_COMPARISON.md
          cat docs/PERFORMANCE_COMPARISON_APPLES_TO_APPLES.md

      - name: Commit updated comparison report
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/PERFORMANCE_COMPARISON.md docs/PERFORMANCE_COMPARISON_APPLES_TO_APPLES.md docs/PERFORMANCE_COMPARISON_APPLES_TO_APPLES.json; then
            echo "No comparison report change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PERFORMANCE_COMPARISON.md docs/PERFORMANCE_COMPARISON_APPLES_TO_APPLES.md docs/PERFORMANCE_COMPARISON_APPLES_TO_APPLES.json
          git commit -m "Perf: refresh comparison report"
          git push

      - name: Upload performance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: performance-reports
          path: |
            docs/PERFORMANCE_COMPARISON.md
            docs/PERFORMANCE_COMPARISON_APPLES_TO_APPLES.md
            docs/PERFORMANCE_COMPARISON_APPLES_TO_APPLES.json

  perf-full-observe:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: make

      - name: Full performance gate
        run: bash tests/performance_gates.sh ./bin/l0c . | tee /tmp/l0_m66_performance_gates.out

      - name: Upload performance artifacts
        uses: actions/upload-artifact@v4
        with:
          name: performance-full-observe
          path: |
            /tmp/l0_m66_performance_gates.out
