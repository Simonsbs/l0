name: Feature request
description: Propose a scoped language/tooling enhancement.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: input
    id: area
    attributes:
      label: Area
      description: Language, verifier, lowering, runtime tool, release, or docs.
      placeholder: "language / verifier / codegen / docs"
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What specific limitation are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe scope, compatibility impact, and expected tests/docs updates.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe simpler alternatives and why they are not sufficient.
    validations:
      required: true
